# Vi copy mode
setw -g mode-keys vi

# Seamless vim-style pane navigation (no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Dim inactive panes (both text AND background)
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=default,bg=colour234'

# Scroll: Ctrl-arrow enters copy-mode, then Up/Down scroll, Left/Right half-page
bind -n C-Up copy-mode
bind -n C-Down copy-mode
bind -n C-Left copy-mode
bind -n C-Right copy-mode
bind -T copy-mode-vi Up send-keys -X scroll-up
bind -T copy-mode-vi Down send-keys -X scroll-down
bind -T copy-mode-vi Left send-keys -X halfpage-up
bind -T copy-mode-vi Right send-keys -X halfpage-down
